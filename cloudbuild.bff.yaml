steps:
  - name: node:24
    entrypoint: bash
    args:
      - -lc
      - |
        npm ci
        npm run policy:verify
        npm test

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - server/bff/Dockerfile
      - -t
      - gcr.io/$PROJECT_ID/mysc-bff:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/mysc-bff:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -lc
      - |
        NETWORK_ARGS=()
        if [[ -n "${_BFF_SERVERLESS_VPC_CONNECTOR}" ]]; then
          NETWORK_ARGS+=(--vpc-connector "${_BFF_SERVERLESS_VPC_CONNECTOR}" --vpc-egress all-traffic)
        fi
        ENV_VARS="BFF_DEPLOY_ENV=${_DEPLOY_ENV},FIREBASE_PROJECT_ID=$PROJECT_ID,BFF_ALLOWED_ORIGINS=${_ALLOWED_ORIGINS},BFF_WORKERS_ENABLED=${_WORKERS_ENABLED},BFF_SCHEDULER_OWNER=${_SCHEDULER_OWNER},BFF_OUTBOX_BATCH=${_OUTBOX_BATCH},BFF_OUTBOX_MAX_ATTEMPTS=${_OUTBOX_MAX_ATTEMPTS},PII_MODE=${_PII_MODE},PII_KMS_KEYS=${_PII_KMS_KEYS},PII_KMS_CURRENT_KEY=${_PII_KMS_CURRENT_KEY}"
        if [[ -n "${_JVM_WEEKLY_API_BASE_URL}" ]]; then
          ENV_VARS="${ENV_VARS},JVM_WEEKLY_API_BASE_URL=${_JVM_WEEKLY_API_BASE_URL}"
        fi
        if [[ -n "${_JVM_WEEKLY_API_ID_TOKEN_AUDIENCE}" ]]; then
          ENV_VARS="${ENV_VARS},JVM_WEEKLY_API_ID_TOKEN_AUDIENCE=${_JVM_WEEKLY_API_ID_TOKEN_AUDIENCE}"
        fi
        SECRET_ARGS=()
        if [[ -n "${_JVM_WEEKLY_INTERNAL_API_TOKEN_SECRET}" ]]; then
          SECRET_ARGS=(--set-secrets "JVM_WEEKLY_INTERNAL_API_TOKEN=${_JVM_WEEKLY_INTERNAL_API_TOKEN_SECRET}:latest")
        fi
        gcloud run deploy mysc-bff \
          --image "gcr.io/$PROJECT_ID/mysc-bff:$COMMIT_SHA" \
          --region "${_REGION}" \
          --platform managed \
          --allow-unauthenticated \
          "${NETWORK_ARGS[@]}" \
          --set-env-vars "${ENV_VARS}" \
          "${SECRET_ARGS[@]}"

substitutions:
  _REGION: asia-northeast3
  _DEPLOY_ENV: stage
  _ALLOWED_ORIGINS: 'http://127.0.0.1:5173,http://localhost:5173'
  _WORKERS_ENABLED: 'false'
  _SCHEDULER_OWNER: disabled
  _OUTBOX_BATCH: '50'
  _OUTBOX_MAX_ATTEMPTS: '8'
  _PII_MODE: 'off'
  _PII_KMS_KEYS: ''
  _PII_KMS_CURRENT_KEY: ''
  _BFF_SERVERLESS_VPC_CONNECTOR: ''
  _JVM_WEEKLY_API_BASE_URL: ''
  _JVM_WEEKLY_API_ID_TOKEN_AUDIENCE: ''
  _JVM_WEEKLY_INTERNAL_API_TOKEN_SECRET: ''

images:
  - gcr.io/$PROJECT_ID/mysc-bff:$COMMIT_SHA
