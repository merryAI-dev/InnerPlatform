spring:
  datasource:
    url: jdbc:h2:mem:jvm_weekly_api;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
weekly:
  internal-api-token: test-weekly-api-token
  firebase-test-tokens-enabled: true
  project-access-backend: disabled
  session-cookie-ttl-seconds: 3600
