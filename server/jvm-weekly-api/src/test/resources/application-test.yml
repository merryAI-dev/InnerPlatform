spring:
  datasource:
    url: jdbc:h2:mem:jvm_weekly_api;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
weekly:
  deploy-env: live
  legacy-week-close-enabled: true
  cashflow-edit-leases-enabled: true
  internal-api-token-enabled: true
  internal-api-token: test-weekly-api-token
  cashflow-settled-week-confirmation-key: test-cashflow-settled-week-confirmation-key-32
  firebase-test-tokens-enabled: true
  project-access-backend: disabled
