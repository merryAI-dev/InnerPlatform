spring:
  datasource:
    url: ${JVM_WEEKLY_DATABASE_URL:jdbc:h2:mem:jvm_weekly_api_local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${JVM_WEEKLY_DATABASE_USER:sa}
    password: ${JVM_WEEKLY_DATABASE_PASSWORD:}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
weekly:
  internal-api-token-enabled: ${JVM_WEEKLY_INTERNAL_API_TOKEN_ENABLED:false}
  internal-api-token: ${JVM_WEEKLY_INTERNAL_API_TOKEN:local-weekly-api-token}
  firebase-project-id: ${JVM_WEEKLY_FIREBASE_PROJECT_ID:}
  firebase-auth-project-id: ${JVM_WEEKLY_FIREBASE_AUTH_PROJECT_ID:${weekly.firebase-project-id}}
  firestore-project-id: ${JVM_WEEKLY_FIRESTORE_PROJECT_ID:${weekly.firebase-project-id}}
  project-access-backend: ${JVM_WEEKLY_PROJECT_ACCESS_BACKEND:disabled}
  allowed-origins: ${JVM_WEEKLY_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
