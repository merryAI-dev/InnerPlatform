spring:
  application:
    name: jvm-weekly-api
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${WEEKLY_API_PORT:8088}
weekly:
  deploy-env: ${JVM_WEEKLY_DEPLOY_ENV:local}
  legacy-week-close-enabled: false
  cashflow-edit-leases-enabled: ${JVM_WEEKLY_EDIT_LEASES_ENABLED:false}
  storage-backend: ${JVM_WEEKLY_STORAGE_BACKEND:firestore}
  internal-api-token-enabled: ${JVM_WEEKLY_INTERNAL_API_TOKEN_ENABLED:false}
  internal-api-token: ${JVM_WEEKLY_INTERNAL_API_TOKEN:}
  cashflow-settled-week-confirmation-key: ${JVM_WEEKLY_CASHFLOW_SETTLED_WEEK_CONFIRMATION_KEY:}
  auth-mode: ${JVM_WEEKLY_AUTH_MODE:strict}
  workspace-email-domain: ${JVM_WEEKLY_WORKSPACE_EMAIL_DOMAIN:mysc.co.kr}
  firebase-project-id: ${JVM_WEEKLY_FIREBASE_PROJECT_ID:${FIREBASE_PROJECT_ID:${GOOGLE_CLOUD_PROJECT:}}}
  firebase-auth-project-id: ${JVM_WEEKLY_FIREBASE_AUTH_PROJECT_ID:${weekly.firebase-project-id}}
  firestore-project-id: ${JVM_WEEKLY_FIRESTORE_PROJECT_ID:${weekly.firebase-project-id}}
  project-access-backend: ${JVM_WEEKLY_PROJECT_ACCESS_BACKEND:firestore}
  allowed-origins: ${JVM_WEEKLY_ALLOWED_ORIGINS:https://myscube.myscguard.app}
