name: Cloudflare Security Daily Report

on:
  schedule:
    # 09:00 Asia/Seoul
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generate and send Cloudflare security report
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ZONE_NAME: myscguard.app
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REQUIRE_SLACK_WEBHOOK: '1'
        run: npm run security:cloudflare:daily-report

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-security-daily-report
          path: tmp/cloudflare-security-reports/
          if-no-files-found: warn
