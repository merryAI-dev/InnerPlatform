name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: RBAC policy verify
        run: npm run policy:verify

      - name: Production build
        env:
          VITE_PLATFORM_API_ENABLED: "true"
          VITE_PLATFORM_API_BASE_URL: https://ci-innerplatform-jvm-weekly-api.example.run.app
        run: npm run build

  product-release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Settlement targeted vitest matrix
        run: npx vitest run src/app/platform/settlement-*.test.ts src/app/platform/weekly-accounting-state.test.ts src/app/data/portal-store.settlement.test.ts src/app/data/portal-store.integration.test.ts src/app/data/cashflow-weeks-store.integration.test.ts

      - name: Settlement emulator-backed integration
        run: npm run test:settlement:integration
