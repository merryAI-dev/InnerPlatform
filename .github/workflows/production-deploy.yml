name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      note:
        description: Deployment note for the release summary
        required: false
        type: string

concurrency:
  group: inner-platform-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy production from main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Production
      url: https://inner-platform.vercel.app
    env:
      VERCEL_CANONICAL_PRODUCTION_HOST: inner-platform.vercel.app
      VERCEL_CLI_PACKAGE: vercel@50.14.0
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check production ref
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Production deploys must be dispatched from refs/heads/main. Current ref: ${GITHUB_REF}" >&2
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Verify CI succeeded for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          ci_conclusion="$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow CI \
            --commit "${commit_sha}" \
            --limit 1 \
            --json conclusion,status \
            --jq '.[0] | select(.status == "completed") | .conclusion')"
          if [ "${ci_conclusion}" != "success" ]; then
            echo "CI must be green before production deploy. Commit ${commit_sha} has CI conclusion: ${ci_conclusion:-missing}" >&2
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify Vercel credentials are configured
        run: |
          test -n "${VERCEL_TOKEN}" || { echo "Missing secret: VERCEL_TOKEN" >&2; exit 1; }
          test -n "${VERCEL_ORG_ID}" || { echo "Missing secret: VERCEL_ORG_ID" >&2; exit 1; }
          test -n "${VERCEL_PROJECT_ID}" || { echo "Missing secret: VERCEL_PROJECT_ID" >&2; exit 1; }

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: RBAC policy verify
        run: npm run policy:verify

      - name: Production build
        run: npm run build

      - name: Deploy to Vercel production
        id: vercel_deploy
        run: |
          set -euo pipefail
          output_file="$(mktemp)"
          npx --yes "${VERCEL_CLI_PACKAGE}" deploy --prod --yes --token "${VERCEL_TOKEN}" 2>&1 | tee "${output_file}"
          deployment_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' "${output_file}" | tail -n 1 || true)"
          if [ -z "${deployment_url}" ]; then
            echo "Could not parse Vercel deployment URL" >&2
            exit 1
          fi
          echo "deployment_url=${deployment_url}" >> "${GITHUB_OUTPUT}"

      - name: Verify canonical production alias
        env:
          DEPLOYMENT_URL: ${{ steps.vercel_deploy.outputs.deployment_url }}
        run: node deploy-prod-align.mjs --verify-only "${DEPLOYMENT_URL}"

      - name: Release summary
        env:
          DEPLOY_NOTE: ${{ inputs.note }}
          DEPLOYMENT_URL: ${{ steps.vercel_deploy.outputs.deployment_url }}
        run: |
          {
            printf '%s\n' "## InnerPlatform production deploy"
            printf '\n'
            printf '%s\n' "- Canonical URL: https://inner-platform.vercel.app"
            printf '%s\n' "- Deployment URL: ${DEPLOYMENT_URL}"
            printf '%s\n' "- Commit: $(git rev-parse HEAD)"
            printf '%s\n' "- Branch: main"
            printf '%s\n' "- Actor: ${GITHUB_ACTOR}"
            printf '%s\n' "- Note: ${DEPLOY_NOTE}"
          } >> "${GITHUB_STEP_SUMMARY}"
