name: Production Deploy

on:
  # main 의 CI 가 초록이면 자동으로 배포한다. 수동 dispatch 는 CI 가 끝나기 전에 눌리면
  # "Verify CI succeeded" 가드에 걸려 실패하는데, 사람이 그 실패를 보고 다시 누를 때까지
  # 배포된 줄 알았던 커밋이 라이브에 없는 시간이 생긴다. 초록을 기다렸다가 트리거하는
  # 일은 사람이 아니라 GitHub 가 해야 한다.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      note:
        description: Deployment note for the release summary
        required: false
        type: string
      promote_alias:
        description: Promote the candidate to the canonical production alias
        required: true
        default: true
        type: boolean

concurrency:
  group: inner-platform-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  deployments: write

jobs:
  preflight:
    name: Resolve production deploy target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # CI 가 실패했거나 PR 이벤트로 돈 CI 는 배포 대상이 아니다.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push')
    outputs:
      proceed: ${{ steps.resolve.outputs.proceed }}
      sha: ${{ steps.resolve.outputs.sha }}
      promote: ${{ steps.resolve.outputs.promote }}
      note: ${{ steps.resolve.outputs.note }}
    steps:
      - name: Resolve deploy target
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_NOTE: ${{ inputs.note }}
          DISPATCH_PROMOTE: ${{ inputs.promote_alias }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${DISPATCH_REF}" != "refs/heads/main" ]; then
              echo "Production deploys must be dispatched from refs/heads/main. Current ref: ${DISPATCH_REF}" >&2
              exit 1
            fi
            sha="${DISPATCH_SHA}"
            promote="${DISPATCH_PROMOTE}"
            note="${DISPATCH_NOTE}"
          else
            sha="${CI_SHA}"
            promote=true
            note="CI green on main"
          fi
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "${sha}" != "${head}" ]; then
            if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "main advanced to ${head} after dispatch; dispatch the current main commit instead." >&2
              exit 1
            fi
            # 자동 트리거는 뒤처진 커밋을 조용히 건너뛴다. 최신 커밋의 CI 가 자기 배포를 띄운다.
            echo "main advanced to ${head}; skipping superseded ${sha}."
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "Deploy target ${sha} (promote_alias=${promote})"
          {
            echo "proceed=true"
            echo "sha=${sha}"
            echo "promote=${promote}"
            echo "note=${note}"
          } >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy production from main
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Production
      url: https://myscube.myscguard.app
    env:
      VERCEL_CANONICAL_PRODUCTION_HOST: myscube.myscguard.app
      VERCEL_CLI_PACKAGE: vercel@50.14.0
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_DEPLOY_ALLOWED_AUTHOR_EMAILS: ai@mysc.co.kr
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      LIVE_FIREBASE_PROJECT_ID: inner-platform-live-20260316
      BFF_DEPLOY_ENV: live
      BFF_AUTH_MODE: firebase_required
      BFF_EDIT_LEASES_ENABLED: 'true'
      BFF_WORKERS_ENABLED: 'true'
      BFF_SCHEDULER_OWNER: vercel
      BFF_MAINTENANCE_READ_ONLY: 'false'
      BFF_ALLOWED_ORIGINS: https://myscube.myscguard.app
      JVM_WEEKLY_AUTH_MODE: strict
      JVM_WEEKLY_API_BASE_URL: ${{ vars.JVM_WEEKLY_API_BASE_URL_LIVE }}
      JVM_WEEKLY_API_ID_TOKEN_AUDIENCE: ${{ vars.JVM_WEEKLY_API_ID_TOKEN_AUDIENCE_LIVE }}
      JVM_WEEKLY_INTERNAL_API_TOKEN: ${{ secrets.JVM_WEEKLY_INTERNAL_API_TOKEN_LIVE }}
      JVM_WEEKLY_API_SERVICE_ACCOUNT_JSON: ${{ secrets.JVM_WEEKLY_API_SERVICE_ACCOUNT_JSON_LIVE }}
      SLACK_ALERT_BOT_TOKEN: ${{ secrets.SLACK_ALERT_BOT_TOKEN }}
      SLACK_ALERT_CHANNEL_ID: C0BQ6980HR6
      # Use a production-scoped secret name so a stale repository-level
      # VERCEL_TOKEN cannot be confused with the Production environment token.
      VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN_PRODUCTION }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 1

      - name: Verify checked out deploy target
        env:
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${DEPLOY_SHA}" || {
            echo "Checked out $(git rev-parse HEAD) but the resolved target is ${DEPLOY_SHA}." >&2
            exit 1
          }

      # 자동 트리거에서는 사실상 자명하지만, 수동 dispatch 와 같은 가드를 통과해야 배포한다.
      - name: Verify CI succeeded for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -euo pipefail
          runs="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="${DEPLOY_SHA}" \
            -f branch=main \
            -f event=push \
            -f per_page=20)"
          jq -e --arg sha "${DEPLOY_SHA}" '
            [.workflow_runs[]
              | select(.head_sha == $sha and .status == "completed" and .conclusion == "success")]
            | length > 0
          ' <<< "${runs}" >/dev/null || {
            echo "CI must be green for ${DEPLOY_SHA} before production deploy." >&2
            exit 1
          }

      - name: Verify Vercel deploy author policy
        run: |
          set -euo pipefail
          author_email="$(git show -s --format=%ae HEAD)"
          case ",${VERCEL_DEPLOY_ALLOWED_AUTHOR_EMAILS}," in
            *",${author_email},"*) ;;
            *)
              echo "Commit author ${author_email} is not allowed for Vercel production deploys." >&2
              echo "Create a no-op release commit authored by one of: ${VERCEL_DEPLOY_ALLOWED_AUTHOR_EMAILS}" >&2
              exit 1
              ;;
          esac

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify Vercel credentials are configured
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN}" || { echo "Missing secret: VERCEL_DEPLOY_TOKEN_PRODUCTION" >&2; exit 1; }
          test -n "${VERCEL_ORG_ID}" || { echo "Missing secret: VERCEL_ORG_ID" >&2; exit 1; }
          test -n "${VERCEL_PROJECT_ID}" || { echo "Missing secret: VERCEL_PROJECT_ID" >&2; exit 1; }
          test -n "${VERCEL_AUTOMATION_BYPASS_SECRET}" || { echo "Missing secret: VERCEL_AUTOMATION_BYPASS_SECRET" >&2; exit 1; }
          test -n "${JVM_WEEKLY_API_BASE_URL}" || { echo "Missing Production variable: JVM_WEEKLY_API_BASE_URL_LIVE" >&2; exit 1; }
          test -n "${JVM_WEEKLY_API_ID_TOKEN_AUDIENCE}" || { echo "Missing Production variable: JVM_WEEKLY_API_ID_TOKEN_AUDIENCE_LIVE" >&2; exit 1; }
          test -n "${JVM_WEEKLY_INTERNAL_API_TOKEN}" || { echo "Missing Production secret: JVM_WEEKLY_INTERNAL_API_TOKEN_LIVE" >&2; exit 1; }
          test -n "${JVM_WEEKLY_API_SERVICE_ACCOUNT_JSON}" || { echo "Missing Production secret: JVM_WEEKLY_API_SERVICE_ACCOUNT_JSON_LIVE" >&2; exit 1; }
          test -n "${SLACK_ALERT_BOT_TOKEN}" || { echo "Missing Production secret: SLACK_ALERT_BOT_TOKEN" >&2; exit 1; }
          npx --yes "${VERCEL_CLI_PACKAGE}" whoami --token "${VERCEL_TOKEN}" --scope merryai-devs-projects >/dev/null

      - name: Deploy to Vercel production
        id: vercel_deploy
        run: |
          set -euo pipefail
          output_file="$(mktemp)"
          commit_sha="$(git rev-parse HEAD)"
          npx --yes "${VERCEL_CLI_PACKAGE}" deploy --prod --yes --skip-domain --token "${VERCEL_TOKEN}" \
            --build-env VITE_PLATFORM_API_ENABLED=true \
            --build-env VITE_FIRESTORE_CORE_ENABLED=false \
            --build-env VITE_FIREBASE_PROJECT_ID="${LIVE_FIREBASE_PROJECT_ID}" \
            --env BFF_DEPLOY_ENV="${BFF_DEPLOY_ENV}" \
            --env BFF_AUTH_MODE="${BFF_AUTH_MODE}" \
            --env BFF_EDIT_LEASES_ENABLED="${BFF_EDIT_LEASES_ENABLED}" \
            --env BFF_WORKERS_ENABLED="${BFF_WORKERS_ENABLED}" \
            --env BFF_SCHEDULER_OWNER="${BFF_SCHEDULER_OWNER}" \
            --env BFF_MAINTENANCE_READ_ONLY="${BFF_MAINTENANCE_READ_ONLY}" \
            --env BFF_ALLOWED_ORIGINS="${BFF_ALLOWED_ORIGINS}" \
            --env MYSCUBE_MCP_OAUTH_ISSUER="https://myscube.myscguard.app" \
            --env MYSCUBE_MCP_PUBLIC_ORIGIN="https://myscube.myscguard.app" \
            --env FIREBASE_PROJECT_ID="${LIVE_FIREBASE_PROJECT_ID}" \
            --env BFF_FIREBASE_AUTH_PROJECT_ID="${LIVE_FIREBASE_PROJECT_ID}" \
            --env BFF_LIVE_FIREBASE_PROJECT_ID="${LIVE_FIREBASE_PROJECT_ID}" \
            --env JVM_WEEKLY_FIRESTORE_PROJECT_ID="${LIVE_FIREBASE_PROJECT_ID}" \
            --env JVM_WEEKLY_AUTH_MODE="${JVM_WEEKLY_AUTH_MODE}" \
            --env JVM_WEEKLY_API_BASE_URL="${JVM_WEEKLY_API_BASE_URL}" \
            --env JVM_WEEKLY_API_ID_TOKEN_AUDIENCE="${JVM_WEEKLY_API_ID_TOKEN_AUDIENCE}" \
            --env JVM_WEEKLY_INTERNAL_API_TOKEN="${JVM_WEEKLY_INTERNAL_API_TOKEN}" \
            --env JVM_WEEKLY_API_SERVICE_ACCOUNT_JSON="${JVM_WEEKLY_API_SERVICE_ACCOUNT_JSON}" \
            --env SLACK_ALERT_WEBHOOK_URL= \
            --env SLACK_ALERT_BOT_TOKEN="${SLACK_ALERT_BOT_TOKEN}" \
            --env SLACK_ALERT_CHANNEL_ID="${SLACK_ALERT_CHANNEL_ID}" \
            --env PROJECT_REGISTRATION_SLACK_WEBHOOK_URL= \
            --env PROJECT_REGISTRATION_SLACK_BOT_TOKEN= \
            --env PROJECT_REGISTRATION_SLACK_CHANNEL_ID= \
            --meta maintenanceReadOnly=false \
            --meta githubCommitSha="${commit_sha}" \
            2>&1 | tee "${output_file}"
          deployment_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' "${output_file}" | tail -n 1 || true)"
          if [ -z "${deployment_url}" ]; then
            echo "Could not parse Vercel deployment URL" >&2
            exit 1
          fi
          deployment_host="${deployment_url#https://}"
          echo "deployment_url=${deployment_url}" >> "${GITHUB_OUTPUT}"
          echo "deployment_host=${deployment_host}" >> "${GITHUB_OUTPUT}"

      - name: Verify production surface before alias
        env:
          DEPLOYMENT_URL: ${{ steps.vercel_deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.DEPLOYMENT_URL;
          const expectedProject = process.env.LIVE_FIREBASE_PROJECT_ID;
          const request = async (path, init) => {
            const response = await fetch(`${base}${path}`, {
              ...init,
              headers: {
                ...init?.headers,
                'x-vercel-protection-bypass': process.env.VERCEL_AUTOMATION_BYPASS_SECRET,
              },
            });
            const body = await response.json().catch(() => ({}));
            return { response, body };
          };

          const health = await request('/api/v1/health');
          if (health.response.status !== 200
            || health.body.projectId !== expectedProject
            || health.body.authMode !== 'firebase_required'
            || health.body.firestoreEmulator !== false) {
            throw new Error(`unsafe production health: ${health.response.status} ${JSON.stringify(health.body)}`);
          }

          const metadata = await request('/.well-known/oauth-protected-resource');
          if (metadata.response.status !== 200 || metadata.body.resource !== 'https://myscube.myscguard.app/mcp') {
            throw new Error(`MCP OAuth discovery is unavailable: ${metadata.response.status} ${JSON.stringify(metadata.body)}`);
          }

          const mcp = await request('/mcp', { method: 'POST', body: '{}' });
          if (mcp.response.status !== 401 || !String(mcp.response.headers.get('www-authenticate') || '').includes('resource_metadata=')) {
            throw new Error(`MCP bearer challenge is unavailable: ${mcp.response.status}`);
          }

          const mutation = await request('/api/v1/__maintenance_probe__', { method: 'POST' });
          if (mutation.response.status !== 400 || mutation.body.error === 'maintenance_read_only') {
            throw new Error(`production maintenance guard still active: ${mutation.response.status} ${JSON.stringify(mutation.body)}`);
          }

          // Workers run from Vercel cron. An unauthenticated call must be rejected as
          // unauthorized, which also proves CRON_SECRET reached the deployment: a missing
          // secret would answer 503 worker_secret_missing instead.
          for (const path of [
            '/api/internal/workers/outbox/run',
            '/api/internal/workers/work-queue/run',
            '/api/internal/workers/payroll/run',
            '/api/internal/workers/client-errors/run',
          ]) {
            const worker = await request(path);
            if (worker.response.status !== 401 || worker.body.error !== 'unauthorized_worker') {
              throw new Error(`worker guard missing at ${path}: ${worker.response.status} ${JSON.stringify(worker.body)}`);
            }
          }
          NODE

      - name: Promote canonical production alias
        if: needs.preflight.outputs.promote == 'true'
        env:
          DEPLOYMENT_HOST: ${{ steps.vercel_deploy.outputs.deployment_host }}
        run: |
          set -euo pipefail
          npx --yes "${VERCEL_CLI_PACKAGE}" alias set \
            "${DEPLOYMENT_HOST}" \
            "${VERCEL_CANONICAL_PRODUCTION_HOST}" \
            --token "${VERCEL_TOKEN}" \
            --scope merryai-devs-projects

      - name: Verify canonical production alias
        if: needs.preflight.outputs.promote == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.vercel_deploy.outputs.deployment_url }}
        run: node deploy-prod-align.mjs --verify-only "${DEPLOYMENT_URL}"

      - name: Release summary
        env:
          DEPLOY_NOTE: ${{ needs.preflight.outputs.note }}
          DEPLOYMENT_URL: ${{ steps.vercel_deploy.outputs.deployment_url }}
        run: |
          {
            printf '%s\n' "## InnerPlatform production deploy"
            printf '\n'
            printf '%s\n' "- Canonical URL: https://myscube.myscguard.app"
            printf '%s\n' "- Deployment URL: ${DEPLOYMENT_URL}"
            printf '%s\n' "- Commit: $(git rev-parse HEAD)"
            printf '%s\n' "- Branch: main"
            printf '%s\n' "- Actor: ${GITHUB_ACTOR}"
            printf '%s\n' "- Note: ${DEPLOY_NOTE}"
          } >> "${GITHUB_STEP_SUMMARY}"
