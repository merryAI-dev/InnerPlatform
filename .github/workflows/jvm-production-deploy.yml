name: JVM Production Deploy

on:
  # main 의 CI 가 초록이고 JVM 소스가 실제로 바뀐 커밋일 때만 자동 배포한다.
  # 매 커밋마다 Cloud Run 리비전을 새로 올리면 바뀐 것 없는 배포가 쌓이고,
  # --min-instances 1 롤아웃 위험만 반복된다.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even when JVM sources did not change
        required: false
        default: false
        type: boolean

concurrency:
  group: inner-platform-jvm-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

env:
  JVM_SOURCE_PATHS: server/jvm-weekly-api .github/workflows/jvm-production-deploy.yml

jobs:
  preflight:
    name: Resolve JVM deploy target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push')
    outputs:
      proceed: ${{ steps.resolve.outputs.proceed }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve deploy target
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          FORCE: ${{ inputs.force }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${DISPATCH_REF}" != "refs/heads/main" ]; then
              echo "JVM production deploys must be dispatched from refs/heads/main. Current ref: ${DISPATCH_REF}" >&2
              exit 1
            fi
            sha="${DISPATCH_SHA}"
          else
            sha="${CI_SHA}"
          fi
          head="$(git rev-parse origin/main)"
          if [ "${sha}" != "${head}" ]; then
            if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "main advanced to ${head} after dispatch; dispatch the current main commit instead." >&2
              exit 1
            fi
            echo "main advanced to ${head}; skipping superseded ${sha}."
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${FORCE}" = "true" ]; then
            echo "Forced deploy of ${sha}."
            printf 'proceed=true\nsha=%s\n' "${sha}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # 마지막으로 성공한 JVM 배포 이후 JVM 소스가 바뀌었는지만 본다.
          # 성공 이력이 없으면(첫 배포) 배포한다.
          last="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/jvm-production-deploy.yml/runs" \
            -f status=success -f branch=main -f per_page=1 --jq '.workflow_runs[0].head_sha // ""')"
          if [ -z "${last}" ] || ! git cat-file -e "${last}^{commit}" 2>/dev/null; then
            echo "No usable previous successful JVM deploy; deploying ${sha}."
          elif git diff --quiet "${last}" "${sha}" -- ${JVM_SOURCE_PATHS}; then
            echo "No JVM source change between ${last} and ${sha}; skipping."
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          else
            echo "JVM sources changed since ${last}:"
            git diff --name-only "${last}" "${sha}" -- ${JVM_SOURCE_PATHS}
          fi
          printf 'proceed=true\nsha=%s\n' "${sha}" >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy JVM candidate and promote
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    env:
      PROJECT_ID: inner-platform-live-20260316
      REGION: asia-northeast3
      SERVICE: innerplatform-jvm-weekly-api-live
      RUNTIME_SERVICE_ACCOUNT: innerplatform-jvm-runtime@inner-platform-live-20260316.iam.gserviceaccount.com
      IMAGE: asia-northeast3-docker.pkg.dev/inner-platform-live-20260316/jvm-images/innerplatform-jvm-weekly-api-live
      JVM_WEEKLY_API_ID_TOKEN_AUDIENCE: ${{ vars.JVM_WEEKLY_API_ID_TOKEN_AUDIENCE_LIVE }}
      JVM_WEEKLY_INTERNAL_API_TOKEN: ${{ secrets.JVM_WEEKLY_INTERNAL_API_TOKEN_LIVE }}
      DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
      CASHFLOW_PROJECT_ID: p1773817948751
      CASHFLOW_YEAR_MONTH: 2026-07

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify checked out deploy target
        env:
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "${DEPLOY_SHA}"

      - name: Verify CI succeeded for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          runs="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="${DEPLOY_SHA}" -f branch=main -f event=push -f per_page=20)"
          jq -e --arg sha "${DEPLOY_SHA}" '
            [.workflow_runs[] | select(.head_sha == $sha and .status == "completed" and .conclusion == "success")]
            | length > 0
          ' <<< "${runs}" >/dev/null

      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_LIVE }}
          service_account: ${{ vars.GCP_JVM_DEPLOYER_SERVICE_ACCOUNT_LIVE }}
          token_format: id_token
          id_token_audience: ${{ vars.JVM_WEEKLY_API_ID_TOKEN_AUDIENCE_LIVE }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Capture current live revision
        id: previous
        run: |
          revision="$(gcloud run services describe "${SERVICE}" --project "${PROJECT_ID}" --region "${REGION}" --format=json \
            | jq -r '.status.traffic[] | select(.percent == 100) | .revisionName' | head -n 1)"
          test -n "${revision}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"

      - name: Build tested image
        id: image
        run: |
          mvn -f server/jvm-weekly-api/pom.xml test
          gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet
          docker build \
            -f server/jvm-weekly-api/Dockerfile \
            -t "${IMAGE}:${DEPLOY_SHA}" \
            .
          docker push "${IMAGE}:${DEPLOY_SHA}"
          digest="$(gcloud artifacts docker images describe "${IMAGE}:${DEPLOY_SHA}" --format='value(image_summary.digest)')"
          test -n "${digest}"
          echo "uri=${IMAGE}@${digest}" >> "${GITHUB_OUTPUT}"

      - name: Deploy candidate without live traffic
        id: candidate
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          revision_suffix="hotfix-${DEPLOY_SHA::8}"
          gcloud run deploy "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --platform managed \
            --image "${IMAGE_URI}" \
            --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
            --revision-suffix "${revision_suffix}" \
            --no-traffic \
            --tag candidate \
            --ingress all \
            --min-instances 1 \
            --no-cpu-throttling \
            --liveness-probe 'httpGet.path=/api/v1/health,initialDelaySeconds=30,periodSeconds=30,timeoutSeconds=5,failureThreshold=3' \
            --set-env-vars '^|^WEEKLY_API_PORT=8080|JVM_WEEKLY_DEPLOY_ENV=live|JVM_WEEKLY_EDIT_LEASES_ENABLED=true|JVM_WEEKLY_INTERNAL_API_TOKEN_ENABLED=true|JVM_WEEKLY_STORAGE_BACKEND=firestore|JVM_WEEKLY_PROJECT_ACCESS_BACKEND=firestore|JVM_WEEKLY_AUTH_MODE=strict|JVM_WEEKLY_WORKSPACE_EMAIL_DOMAIN=mysc.co.kr|JVM_WEEKLY_FIREBASE_PROJECT_ID=inner-platform-live-20260316|JVM_WEEKLY_FIRESTORE_PROJECT_ID=inner-platform-live-20260316|JVM_WEEKLY_FIREBASE_AUTH_PROJECT_ID=inner-platform-live-20260316|JVM_WEEKLY_ALLOWED_ORIGINS=https://myscube.myscguard.app' \
            --set-secrets 'JVM_WEEKLY_INTERNAL_API_TOKEN=innerplatform-weekly-api-token:latest,JVM_WEEKLY_CASHFLOW_SETTLED_WEEK_CONFIRMATION_KEY=innerplatform-cashflow-settled-week-confirmation-key:latest'
          revision="${SERVICE}-${revision_suffix}"
          candidate_url="$(gcloud run services describe "${SERVICE}" --project "${PROJECT_ID}" --region "${REGION}" --format=json \
            | jq -r --arg revision "${revision}" '.status.traffic[] | select(.revisionName == $revision and .tag == "candidate") | .url')"
          test -n "${candidate_url}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          echo "url=${candidate_url}" >> "${GITHUB_OUTPUT}"

      - name: Verify candidate against legacy live read
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            "${CANDIDATE_URL}/api/v1/health" \
            | jq -e '.ok == true and .service == "jvm-weekly-api"' >/dev/null
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -H "x-inner-platform-service-token: ${JVM_WEEKLY_INTERNAL_API_TOKEN}" \
            -H 'x-tenant-id: mysc' \
            -H 'x-actor-id: github-jvm-deployer' \
            -H 'x-actor-role: ADMIN' \
            "${CANDIDATE_URL}/api/v1/cashflow/${CASHFLOW_PROJECT_ID}/month-close/dashboard-source?yearMonth=${CASHFLOW_YEAR_MONTH}" \
            | jq -e '.monthClose.projectId == env.CASHFLOW_PROJECT_ID and .monthClose.yearMonth == env.CASHFLOW_YEAR_MONTH' >/dev/null

      - name: Promote verified candidate
        id: promote
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          gcloud run services update-traffic "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --to-revisions "${REVISION}=100" \
            --set-tags "candidate=${REVISION}"

      - name: Verify canonical service after promotion
        env:
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          canonical_url="$(gcloud run services describe "${SERVICE}" --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.url)')"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            "${canonical_url}/api/v1/health" \
            | jq -e '.ok == true and .service == "jvm-weekly-api"' >/dev/null
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -H "x-inner-platform-service-token: ${JVM_WEEKLY_INTERNAL_API_TOKEN}" \
            -H 'x-tenant-id: mysc' \
            -H 'x-actor-id: github-jvm-deployer' \
            -H 'x-actor-role: ADMIN' \
            "${canonical_url}/api/v1/cashflow/${CASHFLOW_PROJECT_ID}/month-close/dashboard-source?yearMonth=${CASHFLOW_YEAR_MONTH}" \
            | jq -e '.monthClose.projectId == env.CASHFLOW_PROJECT_ID and .monthClose.yearMonth == env.CASHFLOW_YEAR_MONTH' >/dev/null

      - name: Roll back failed promotion
        if: failure() && steps.promote.outcome == 'success'
        env:
          PREVIOUS_REVISION: ${{ steps.previous.outputs.revision }}
        run: |
          gcloud run services update-traffic "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --to-revisions "${PREVIOUS_REVISION}=100" \
            --set-tags "candidate=${PREVIOUS_REVISION}"
