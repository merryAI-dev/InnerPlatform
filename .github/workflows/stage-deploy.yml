name: Stage Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy to stage. Only main is allowed.
        required: false
        default: main
        type: string
      note:
        description: Deployment note for the stage summary
        required: false
        type: string

concurrency:
  group: inner-platform-stage
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy stage from main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Stage
      url: https://inner-platform-internal-stage-merryai-devs-projects.vercel.app
    env:
      STAGE_CANONICAL_HOST: inner-platform-internal-stage-merryai-devs-projects.vercel.app
      STAGE_FIREBASE_PROJECT_ID: mysc-bmp-14173451
      LIVE_FIREBASE_PROJECT_ID: inner-platform-live-20260316
      BFF_DEPLOY_ENV: stage
      BFF_EDIT_LEASES_ENABLED: 'true'
      BFF_WORKERS_ENABLED: 'false'
      BFF_SCHEDULER_OWNER: disabled
      GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: '{}'
      VERCEL_TARGET_ENV: preview
      JVM_WEEKLY_FIRESTORE_PROJECT_ID: mysc-bmp-14173451
      JVM_WEEKLY_AUTH_MODE: strict
      JVM_WEEKLY_API_BASE_URL: ${{ vars.JVM_WEEKLY_API_BASE_URL_STAGE }}
      JVM_WEEKLY_INTERNAL_API_TOKEN: ${{ secrets.JVM_WEEKLY_INTERNAL_API_TOKEN_STAGE }}
      JVM_WEEKLY_API_ID_TOKEN_AUDIENCE: ${{ vars.JVM_WEEKLY_API_ID_TOKEN_AUDIENCE_STAGE }}
      JVM_WEEKLY_API_SERVICE_ACCOUNT_JSON: ${{ secrets.JVM_WEEKLY_API_SERVICE_ACCOUNT_JSON_STAGE }}
      VERCEL_CLI_PACKAGE: vercel@50.14.0
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN_STAGE }}

    steps:
      - name: Resolve deploy ref
        id: deploy_ref
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            target_ref="${{ inputs.ref || 'main' }}"
          else
            target_ref="${GITHUB_REF_NAME}"
          fi
          if [ "${target_ref}" != "main" ]; then
            echo "Stage deploys must use main. Current ref: ${target_ref}" >&2
            exit 1
          fi
          echo "target_ref=${target_ref}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.deploy_ref.outputs.target_ref }}
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify stage deploy policy and credentials
        run: |
          set -euo pipefail
          node scripts/assert-safe-stage-deploy.mjs
          test -n "${VERCEL_TOKEN}" || { echo "Missing secret: VERCEL_DEPLOY_TOKEN_STAGE" >&2; exit 1; }
          test -n "${VERCEL_ORG_ID}" || { echo "Missing secret: VERCEL_ORG_ID" >&2; exit 1; }
          test -n "${VERCEL_PROJECT_ID}" || { echo "Missing secret: VERCEL_PROJECT_ID" >&2; exit 1; }
          test -n "${JVM_WEEKLY_API_BASE_URL}" || { echo "Missing Stage variable: JVM_WEEKLY_API_BASE_URL_STAGE" >&2; exit 1; }
          test -n "${JVM_WEEKLY_INTERNAL_API_TOKEN}" || { echo "Missing Stage secret: JVM_WEEKLY_INTERNAL_API_TOKEN_STAGE" >&2; exit 1; }
          test -n "${JVM_WEEKLY_API_ID_TOKEN_AUDIENCE}" || { echo "Missing Stage variable: JVM_WEEKLY_API_ID_TOKEN_AUDIENCE_STAGE" >&2; exit 1; }
          test -n "${JVM_WEEKLY_API_SERVICE_ACCOUNT_JSON}" || { echo "Missing Stage secret: JVM_WEEKLY_API_SERVICE_ACCOUNT_JSON_STAGE" >&2; exit 1; }
          FIREBASE_PROJECT_ID="${STAGE_FIREBASE_PROJECT_ID}" node scripts/assert-stage-edit-lease-runtime.mjs
          npx --yes "${VERCEL_CLI_PACKAGE}" whoami --token "${VERCEL_TOKEN}" --scope merryai-devs-projects >/dev/null
          test -n "$(git rev-parse HEAD)" || { echo "Could not resolve deploy commit." >&2; exit 1; }

      - name: Deploy Git artifact to Vercel preview
        id: vercel_deploy
        env:
          TARGET_REF: ${{ steps.deploy_ref.outputs.target_ref }}
        run: |
          set -euo pipefail
          output_file="$(mktemp)"
          commit_sha="$(git rev-parse HEAD)"
          npx --yes "${VERCEL_CLI_PACKAGE}" deploy --yes --no-wait --target preview --token "${VERCEL_TOKEN}" \
            --build-env VITE_PLATFORM_API_ENABLED=true \
            --env BFF_DEPLOY_ENV="${BFF_DEPLOY_ENV}" \
            --env BFF_EDIT_LEASES_ENABLED="${BFF_EDIT_LEASES_ENABLED}" \
            --env BFF_WORKERS_ENABLED="${BFF_WORKERS_ENABLED}" \
            --env BFF_SCHEDULER_OWNER="${BFF_SCHEDULER_OWNER}" \
            --env GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON="${GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON}" \
            --env BFF_ALLOWED_ORIGINS="https://${STAGE_CANONICAL_HOST}" \
            --env FIREBASE_PROJECT_ID="${STAGE_FIREBASE_PROJECT_ID}" \
            --env BFF_LIVE_FIREBASE_PROJECT_ID="${LIVE_FIREBASE_PROJECT_ID}" \
            --env JVM_WEEKLY_FIRESTORE_PROJECT_ID="${JVM_WEEKLY_FIRESTORE_PROJECT_ID}" \
            --env JVM_WEEKLY_AUTH_MODE="${JVM_WEEKLY_AUTH_MODE}" \
            --env JVM_WEEKLY_API_BASE_URL="${JVM_WEEKLY_API_BASE_URL}" \
            --env JVM_WEEKLY_INTERNAL_API_TOKEN="${JVM_WEEKLY_INTERNAL_API_TOKEN}" \
            --env JVM_WEEKLY_API_ID_TOKEN_AUDIENCE="${JVM_WEEKLY_API_ID_TOKEN_AUDIENCE}" \
            --env JVM_WEEKLY_API_SERVICE_ACCOUNT_JSON="${JVM_WEEKLY_API_SERVICE_ACCOUNT_JSON}" \
            --meta stagePolicy=github-actions-git-only \
            --meta githubCommitSha="${commit_sha}" \
            --meta githubCommitRef="${TARGET_REF}" \
            2>&1 | tee "${output_file}"
          deployment_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' "${output_file}" | tail -n 1 || true)"
          if [ -z "${deployment_url}" ]; then
            echo "Could not parse Vercel deployment URL" >&2
            exit 1
          fi
          deployment_host="${deployment_url#https://}"
          echo "deployment_url=${deployment_url}" >> "${GITHUB_OUTPUT}"
          echo "deployment_host=${deployment_host}" >> "${GITHUB_OUTPUT}"

      - name: Verify stage artifact before alias
        env:
          DEPLOYMENT_HOST: ${{ steps.vercel_deploy.outputs.deployment_host }}
        run: |
          set -euo pipefail
          inspect_file="$(mktemp)"
          npx --yes "${VERCEL_CLI_PACKAGE}" inspect \
            "${DEPLOYMENT_HOST}" \
            --wait \
            --timeout 10m \
            --format=json \
            --token "${VERCEL_TOKEN}" > "${inspect_file}"
          node -e '
            const fs = require("fs");
            const path = process.argv[1];
            const raw = fs.readFileSync(path, "utf8");
            const jsonStart = raw.indexOf("{");
            if (jsonStart < 0) {
              throw new Error(`Could not parse Vercel inspect output: ${raw.slice(0, 200)}`);
            }
            const inspect = JSON.parse(raw.slice(jsonStart));
            if (inspect.readyState !== "READY") {
              throw new Error(`Stage artifact is not READY: ${inspect.readyState}`);
            }
            if (inspect.target === "production") {
              throw new Error("Stage artifact must not be a production deployment");
            }
          ' "${inspect_file}"
          status_and_type="$(curl -sS -o /tmp/stage-missing-asset.txt -w '%{http_code} %{content_type}' "https://${DEPLOYMENT_HOST}/assets/__stage_missing_asset_probe__.css")"
          echo "Missing asset response: ${status_and_type}"
          if [[ "${status_and_type}" != 404\ * ]]; then
            cat /tmp/stage-missing-asset.txt
            echo "Missing static assets must return 404." >&2
            exit 1
          fi
          if [[ "${status_and_type}" == *"text/html"* ]]; then
            cat /tmp/stage-missing-asset.txt
            echo "Missing static assets must not return index.html." >&2
            exit 1
          fi

      - name: Promote stage alias
        env:
          DEPLOYMENT_HOST: ${{ steps.vercel_deploy.outputs.deployment_host }}
        run: |
          set -euo pipefail
          npx --yes "${VERCEL_CLI_PACKAGE}" alias set \
            "${DEPLOYMENT_HOST}" \
            "${STAGE_CANONICAL_HOST}" \
            --token "${VERCEL_TOKEN}"

      - name: Verify stage surface
        env:
          DEPLOYMENT_HOST: ${{ steps.vercel_deploy.outputs.deployment_host }}
        run: |
          set -euo pipefail
          inspect_file="$(mktemp)"
          npx --yes "${VERCEL_CLI_PACKAGE}" inspect \
            "${STAGE_CANONICAL_HOST}" \
            --format=json \
            --token "${VERCEL_TOKEN}" > "${inspect_file}"
          node -e '
            const fs = require("fs");
            const path = process.argv[1];
            const expectedHost = process.env.DEPLOYMENT_HOST;
            const raw = fs.readFileSync(path, "utf8");
            const jsonStart = raw.indexOf("{");
            if (jsonStart < 0) {
              throw new Error(`Could not parse Vercel inspect output: ${raw.slice(0, 200)}`);
            }
            const inspect = JSON.parse(raw.slice(jsonStart));
            if (inspect.readyState !== "READY") {
              throw new Error(`Stage alias is not READY: ${inspect.readyState}`);
            }
            if (inspect.target === "production") {
              throw new Error("Stage alias must not point to a production deployment");
            }
            if (inspect.url !== expectedHost) {
              throw new Error(`Stage alias points to ${inspect.url}, expected ${expectedHost}`);
            }
          ' "${inspect_file}"
          root_status="$(curl -sS -D /tmp/stage-root-headers.txt -o /tmp/stage-root-response.txt -w '%{http_code}' "https://${STAGE_CANONICAL_HOST}/")"
          case "${root_status}" in
            200) ;;
            *)
              echo "Unexpected stage root status: ${root_status}" >&2
              cat /tmp/stage-root-headers.txt >&2 || true
              cat /tmp/stage-root-response.txt >&2 || true
              exit 1
              ;;
          esac
          if grep -iq '^cf-ray:' /tmp/stage-root-headers.txt || grep -iq '^server: cloudflare' /tmp/stage-root-headers.txt; then
            echo "Stage must stay on the internal Vercel route and must not traverse Cloudflare." >&2
            cat /tmp/stage-root-headers.txt >&2 || true
            exit 1
          fi
          if grep -iq '^content-security-policy-report-only:' /tmp/stage-root-headers.txt; then
            echo "Stage must not receive security-domain CSP report-only headers." >&2
            cat /tmp/stage-root-headers.txt >&2 || true
            exit 1
          fi
          config_status="$(curl -sS -D /tmp/stage-config-headers.txt -o /tmp/stage-config-response.txt -w '%{http_code}' \
            "https://${STAGE_CANONICAL_HOST}/api/v1/projects/p1773651024850/cashflow-sheet-lab/config")"
          case "${config_status}" in
            200|401) ;;
            *)
              echo "Unexpected cashflow config status from stage: ${config_status}" >&2
              cat /tmp/stage-config-headers.txt >&2 || true
              cat /tmp/stage-config-response.txt >&2 || true
              exit 1
              ;;
          esac
          if grep -iq '^cf-ray:' /tmp/stage-config-headers.txt || grep -iq '^server: cloudflare' /tmp/stage-config-headers.txt; then
            echo "Stage API must stay on the internal Vercel route and must not traverse Cloudflare." >&2
            cat /tmp/stage-config-headers.txt >&2 || true
            exit 1
          fi

      - name: Stage deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.vercel_deploy.outputs.deployment_url }}
          TARGET_REF: ${{ steps.deploy_ref.outputs.target_ref }}
          DEPLOY_NOTE: ${{ inputs.note }}
        run: |
          {
            printf '%s\n' "## InnerPlatform stage deploy"
            printf '\n'
            printf '%s\n' "- Canonical URL: https://${STAGE_CANONICAL_HOST}"
            printf '%s\n' "- Deployment URL: ${DEPLOYMENT_URL}"
            printf '%s\n' "- Commit: $(git rev-parse HEAD)"
            printf '%s\n' "- Git ref: ${TARGET_REF}"
            printf '%s\n' "- Actor: ${GITHUB_ACTOR}"
            printf '%s\n' "- Note: ${DEPLOY_NOTE:-}"
          } >> "${GITHUB_STEP_SUMMARY}"
