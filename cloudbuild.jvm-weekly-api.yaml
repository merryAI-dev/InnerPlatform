steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        if [[ "$PROJECT_ID" != "inner-platform-qa-20260310" ]]; then
          echo "[cloudbuild-jvm-weekly-api] Stage-only JVM build requires project inner-platform-qa-20260310"
          exit 1
        fi
        if ! [[ "${_IMAGE_TAG}" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "[cloudbuild-jvm-weekly-api] _IMAGE_TAG is invalid"
          exit 1
        fi

  - name: maven:3.9-eclipse-temurin-21
    entrypoint: bash
    args:
      - -lc
      - mvn -f server/jvm-weekly-api/pom.xml test

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - server/jvm-weekly-api/Dockerfile
      - -t
      - gcr.io/$PROJECT_ID/innerplatform-jvm-weekly-api-lease-stage:${_IMAGE_TAG}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/innerplatform-jvm-weekly-api-lease-stage:${_IMAGE_TAG}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        if [[ "$PROJECT_ID" != "inner-platform-qa-20260310" ]]; then
          echo "[cloudbuild-jvm-weekly-api] Stage-only JVM deploy requires project inner-platform-qa-20260310"
          exit 1
        fi
        gcloud run deploy innerplatform-jvm-weekly-api-lease-stage \
          --project "$PROJECT_ID" \
          --image "gcr.io/$PROJECT_ID/innerplatform-jvm-weekly-api-lease-stage:${_IMAGE_TAG}" \
          --region asia-northeast3 \
          --platform managed \
          --ingress all \
          --set-env-vars "^|^WEEKLY_API_PORT=8080|JVM_WEEKLY_DEPLOY_ENV=stage|JVM_WEEKLY_EDIT_LEASES_ENABLED=true|JVM_WEEKLY_INTERNAL_API_TOKEN_ENABLED=true|JVM_WEEKLY_STORAGE_BACKEND=firestore|JVM_WEEKLY_PROJECT_ACCESS_BACKEND=firestore|JVM_WEEKLY_AUTH_MODE=strict|JVM_WEEKLY_WORKSPACE_EMAIL_DOMAIN=mysc.co.kr|JVM_WEEKLY_FIREBASE_PROJECT_ID=mysc-bmp-14173451|JVM_WEEKLY_FIRESTORE_PROJECT_ID=mysc-bmp-14173451|JVM_WEEKLY_FIREBASE_AUTH_PROJECT_ID=mysc-bmp-14173451|JVM_WEEKLY_ALLOWED_ORIGINS=https://inner-platform-internal-stage-merryai-devs-projects.vercel.app" \
          --set-secrets "JVM_WEEKLY_INTERNAL_API_TOKEN=${_JVM_WEEKLY_INTERNAL_API_TOKEN_SECRET}:latest"
        SERVICE_URL="$(gcloud run services describe innerplatform-jvm-weekly-api-lease-stage \
          --project "$PROJECT_ID" \
          --region asia-northeast3 \
          --format='value(status.url)')"
        case "$${SERVICE_URL}" in
          https://innerplatform-jvm-weekly-api-lease-stage*.run.app) ;;
          *)
            echo "[cloudbuild-jvm-weekly-api] Stage-only JVM deploy returned an unsafe service URL"
            exit 1
            ;;
        esac
        printf '%s' "$${SERVICE_URL}" > /workspace/.jvm-weekly-stage-url

substitutions:
  _IMAGE_TAG: manual
  _JVM_WEEKLY_INTERNAL_API_TOKEN_SECRET: innerplatform-weekly-api-token

images:
  - gcr.io/$PROJECT_ID/innerplatform-jvm-weekly-api-lease-stage:${_IMAGE_TAG}
